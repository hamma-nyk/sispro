# Nginx Configuration untuk SisPro
# 
# Pilihan 1: Jika SisPro diakses via Subfolder (contoh: http://192.168.10.25:8080/sispro)
# Masukkan blok rewrite ini ke dalam file rewrite vhost Nginx (FlyEnv / aaPanel / Nginx vhost rewrite):
# -----------------------------------------------------------------------------------------------------
# location / {
#     try_files $uri $uri/ $uri.php$is_args$args;
# }
# location ~ ^/.*/(config|includes|cron|logs)/ {
#     deny all;
#     return 404;
# }
# location ~* \.(sqlite|db|conf|log|ini|json|yaml|yml|env|bak|sql)$ {
#     deny all;
#     return 404;
# }
# -----------------------------------------------------------------------------------------------------

# Pilihan 2: Jika SisPro berjalan sebagai Standalone Server Block (Dedicated Domain / Subdomain / Port)
server {
    listen 80;
    server_name localhost;

    root /var/www/html/sispro; # Sesuaikan root path project
    index index.php index.html;

    charset utf-8;
    client_max_body_size 64M;

    # 1. Header Keamanan
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 2. Redirect index.php langsung ke root / (301)
    if ($request_uri ~* "^/index\.php($|\?.*)") {
        return 301 /$is_args$args;
    }

    # 3. Clean URLs
    location / {
        try_files $uri $uri/ $uri.php$is_args$args;
    }

    # 4. Blok direktori sensitif
    location ~ ^/(config|includes|cron|logs)/ {
        deny all;
        return 404;
    }

    # 5. Blok file tersembunyi (.env, .git, dll)
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # 6. Blok file konfigurasi & database
    location ~* \.(sqlite|db|conf|log|ini|json|yaml|yml|env|bak|sql)$ {
        deny all;
        return 404;
    }

    # 7. PHP FastCGI Pass
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000; # Sesuaikan port / socket PHP-FPM
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 300;
    }

    # 8. Cache aset statis
    location ~* \.(css|js|jpg|jpeg|gif|png|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }
}
